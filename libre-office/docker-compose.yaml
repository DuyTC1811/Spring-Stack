services:
  only-office:
    image: onlyoffice/documentserver:latest
    container_name: only-office
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - JWT_ENABLED=false
      # - JWT_SECRET=change_me_this_secret_must_be_32+_chars
      # - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_lib:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql
      - ./fonts:/usr/share/fonts/truetype/custom

  postgres:
    image: docker.io/postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duytc
      POSTGRES_PASSWORD: anhduy12
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  minio:
    # minio/minio đã bị xoá khỏi Docker Hub (09/2026) -> dùng bản build của Chainguard
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: duytc
      MINIO_ROOT_PASSWORD: anhduy12
    volumes:
      - minio_data:/data

volumes:
  oo_data:
  oo_lib:
  oo_db:
  postgres_data:
  minio_data: