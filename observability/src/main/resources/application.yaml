server:
  port: 8080
spring:
  application:
    name: observability
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://192.168.122.102:5432/postgres
    username: duytc
    password: anhduy12
    driver-class-name: org.postgresql.Driver
  mvc:
    problemdetails:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s

fx:
  base-url: ${FX_BASE_URL:http://localhost:8080}

management:
  server:
    port: 8081                    # tách port actuator, không public ra ngoài qua gateway
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    annotations:
      enabled: true               # bật @Timed / @Counted (cần spring-boot-starter-aop)
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}

logging:
  structured:
    format:
      # Log JSON ra stdout: OBI chỉ chèn trace_id/span_id vào log dạng JSON
      console: ecs
