server:
  port: 8080
spring:
  application:
    name: observability
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false                 # in qua System.out -> phá log JSON; SQL đã có span từ datasource-micrometer
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://192.168.122.102:5432/postgres
    username: duytc
    password: anhduy12
    driver-class-name: org.postgresql.Driver
  mvc:
    problemdetails:
      enabled: true
fx:
  base-url: ${FX_BASE_URL:http://localhost:8080}

management:
  # ===== Actuator: tách port, không public qua gateway =====
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness

  # ===== Metrics: Alloy scrape :8081/actuator/prometheus =====
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
  otlp:
    metrics:
      export:
        enabled: false            # tắt push OTLP, tránh trùng với scrape

  # ===== Observation API =====
  observations:
    annotations:
      enabled: true               # @Observed / @Timed / @Counted (cần spring-boot-starter-aspectj)

  # ===== Tracing: Micrometer -> OTLP -> Alloy -> Tempo =====
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # prod: 0.1
  opentelemetry:
    resource-attributes:
      deployment.environment: ${APP_ENV:local}   # để lọc trace theo env trong Tempo
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# ===== Log: JSON có trace.id / span.id =====
logging:
  structured:
    format:
      # Log JSON ra stdout: OBI chỉ chèn trace_id/span_id vào log dạng JSON
      console: ecs
